<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentTrace HD — Live Execution Visualizer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: monospace; overflow: hidden; }
  #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

  #hud { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }

  #header { position: fixed; top: 20px; left: 20px; pointer-events: all; }
  #header h1 { font-size: 14px; font-weight: normal; color: #7df9ff; letter-spacing: 0.15em; text-transform: uppercase; }
  #header p { font-size: 11px; color: #555; margin-top: 4px; }

  #controls { position: fixed; top: 20px; right: 20px; pointer-events: all; display: flex; flex-direction: column; gap: 8px; }
  #session-input { background: #111; border: 0.5px solid #333; color: #e0e0e0; padding: 6px 10px; font-family: monospace; font-size: 11px; width: 280px; outline: none; }
  #session-input:focus { border-color: #7df9ff; }
  .btn { background: transparent; border: 0.5px solid #444; color: #aaa; padding: 6px 12px; font-family: monospace; font-size: 11px; cursor: pointer; text-align: left; }
  .btn:hover { border-color: #7df9ff; color: #7df9ff; }
  .btn.active { border-color: #7df9ff; color: #7df9ff; }

  #stats { position: fixed; bottom: 20px; left: 20px; pointer-events: none; }
  .stat-row { font-size: 11px; color: #555; margin-bottom: 4px; }
  .stat-row span { color: #7df9ff; margin-left: 8px; }

  #legend { position: fixed; bottom: 20px; right: 20px; pointer-events: none; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #666; margin-bottom: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; color: #444; text-align: center; pointer-events: none; }

  #node-tooltip {
    position: fixed; background: #111; border: 0.5px solid #333;
    padding: 10px 14px; font-size: 11px; pointer-events: none;
    display: none; max-width: 240px; line-height: 1.6;
  }
  .tt-row { color: #555; }
  .tt-row span { color: #e0e0e0; }
  .tt-highlight { color: #7df9ff; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud">
  <div id="header">
    <h1>AgentTrace HD</h1>
    <p>High-Dimensional Execution Space</p>
  </div>

  <div id="controls">
    <input id="session-input" type="text" placeholder="Enter session ID..." />
    <button class="btn" onclick="loadSession()">Load completed session</button>
    <button class="btn" id="live-btn" onclick="connectLive()">Connect live session</button>
    <button class="btn" onclick="loadLatestSession()">Load latest session</button>
    <button class="btn" onclick="loadMicroSession()">Load micro trajectory</button>
    <button class="btn" onclick="resetView()">Reset view</button>
  </div>

  <div id="stats">
    <div class="stat-row">nodes <span id="stat-nodes">0</span></div>
    <div class="stat-row">reasoning hops <span id="stat-reasoning">0</span></div>
    <div class="stat-row">tool calls <span id="stat-tools">0</span></div>
    <div class="stat-row">errors <span id="stat-errors">0</span></div>
    <div class="stat-row">current step <span id="stat-step">—</span></div>
  </div>

  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#7df9ff"></div>reasoning</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffd700"></div>tool call</div>
    <div class="legend-item"><div class="legend-dot" style="background:#98fb98"></div>tool response</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div>error</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffffff; box-shadow: 0 0 6px #fff"></div>current head</div>
  </div>

  <div id="status">Enter a session ID above<br>or connect to a live session</div>
</div>

<div id="node-tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── SCENE SETUP ───────────────────────────────────────────
const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 0, 8);

// ambient light
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dirLight = new THREE.DirectionalLight(0x7df9ff, 0.6);
dirLight.position.set(5, 5, 5);
scene.add(dirLight);

// grid
const gridHelper = new THREE.GridHelper(20, 40, 0x1a1a2e, 0x1a1a2e);
scene.add(gridHelper);

// ─── CAMERA ORBIT ──────────────────────────────────────────
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0, phi: Math.PI / 3, r: 8 };

canvas.addEventListener("mousedown", e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("mouseup", () => isDragging = false);
canvas.addEventListener("mousemove", e => {
  if (!isDragging) { checkHover(e); return; }
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  spherical.theta -= dx * 0.005;
  spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - dy * 0.005));
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});
canvas.addEventListener("wheel", e => {
  spherical.r = Math.max(2, Math.min(30, spherical.r + e.deltaY * 0.01));
  updateCamera();
});

function updateCamera() {
  camera.position.set(
    spherical.r * Math.sin(spherical.phi) * Math.sin(spherical.theta),
    spherical.r * Math.cos(spherical.phi),
    spherical.r * Math.sin(spherical.phi) * Math.cos(spherical.theta)
  );
  camera.lookAt(0, 0, 0);
}

function resetView() {
  spherical = { theta: 0, phi: Math.PI / 3, r: 8 };
  updateCamera();
}

// ─── NODE COLORS ───────────────────────────────────────────
const NODE_COLORS = {
  reasoning:     0x7df9ff,
  tool_call:     0xffd700,
  tool_response: 0x98fb98,
  error:         0xff6b6b,
  head:          0xffffff,
};

function getColor(node) {
  if (node.status === "error") return NODE_COLORS.error;
  return NODE_COLORS[node.node_type] || 0xaaaaaa;
}

// ─── SCENE STATE ───────────────────────────────────────────
let nodeMeshes = [];
let trailPoints = [];
let trailLine = null;
let headMesh = null;
let currentNodes = [];

function getNodeColor(nodeType, status) {
  if (status === "error") return NODE_COLORS.error;
  return NODE_COLORS[nodeType] || 0xaaaaaa;
}

function clearScene() {
  nodeMeshes.forEach(m => scene.remove(m));
  nodeMeshes = [];
  trailPoints = [];
  if (trailLine) scene.remove(trailLine);
  trailLine = null;
  if (headMesh) scene.remove(headMesh);
  headMesh = null;
  currentNodes = [];
  updateStats([]);
  document.getElementById("status").style.display = "none";
}


let nodeRegistry = {};

function renderNodes(nodes) {
  if (!nodes || nodes.length === 0) return;

  const sorted = [...nodes].sort(
    (a, b) => (a.step_number || 0) - (b.step_number || 0)
  );

  sorted.forEach(node => {
    const existing = nodeRegistry[node.node_id];

    if (!existing) {
      // new node — add to scene immediately
      addNodeToScene(node);
      nodeRegistry[node.node_id] = node;
    } else if (
      !existing.has_embedding && node.has_embedding
    ) {
      // position update — snap to real HD coordinates
      updateNodePosition(node);
      nodeRegistry[node.node_id] = node;
    }
  });

  updateHead(sorted);
  rebuildTrails(sorted);
  updateStats(
    sorted.filter(n => n.is_parent)
  );
}

function addNodeToScene(node) {
  const isMicro = node.node_type === "micro";
  const isParent = node.is_parent;

  const size = isParent ? 0.09 : 0.025;
  const color = isParent
    ? getNodeColor(node.node_type, node.status)
    : 0x223355;
  const opacity = isParent ? 0.9 : 0.4;

  const geo = new THREE.SphereGeometry(size, 8, 8);
  const mat = new THREE.MeshPhongMaterial({
    color,
    emissive: color,
    emissiveIntensity: isParent ? 0.3 : 0.05,
    transparent: true,
    opacity,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(
    (node.x || 0) * 3,
    (node.y || 0) * 3,
    (node.z || 0) * 3
  );
  mesh.userData = node;
  mesh.name = node.node_id;
  scene.add(mesh);
  nodeMeshes.push(mesh);
}

function updateNodePosition(node) {
  const mesh = scene.getObjectByName(node.node_id);
  if (!mesh) return;

  // smooth snap to real position
  const target = new THREE.Vector3(
    (node.x || 0) * 3,
    (node.y || 0) * 3,
    (node.z || 0) * 3
  );
  mesh.position.copy(target);
  mesh.userData = node;

  // brighten when real position arrives
  if (node.node_type === "micro") {
    mesh.material.opacity = 0.6;
    mesh.material.emissiveIntensity = 0.15;
  }
}

function updateHead(sorted) {
  const parents = sorted.filter(n => n.is_parent);
  if (parents.length === 0) return;

  const lastParent = parents[parents.length - 1];

  const targetX = (lastParent.x || 0) * 3;
  const targetY = (lastParent.y || 0) * 3;
  const targetZ = (lastParent.z || 0) * 3;

  headTargetPos.set(targetX, targetY, targetZ);

  if (!headMesh) {
    headCurrentPos.set(targetX, targetY, targetZ);
    buildHead();
  } else {
    headMoving = true;
  }
}

function rebuildTrails(sorted) {
  const parents = sorted.filter(
    n => n.is_parent && n.has_embedding
  );
  const micros = sorted.filter(
    n => n.node_type === "micro" && n.has_embedding
  );

  // parent trail
  if (parents.length > 1) {
    if (trailLine) scene.remove(trailLine);
    const points = parents.map(n =>
      new THREE.Vector3(
        (n.x || 0) * 3,
        (n.y || 0) * 3,
        (n.z || 0) * 3
      )
    );
    const geo = new THREE.BufferGeometry()
      .setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({
      color: 0x334466,
    });
    trailLine = new THREE.Line(geo, mat);
    scene.add(trailLine);
  }

  // micro trail
  if (micros.length > 1) {
    const existing = scene.getObjectByName(
      "micro_trail"
    );
    if (existing) scene.remove(existing);

    const points = micros.map(n =>
      new THREE.Vector3(
        (n.x || 0) * 3,
        (n.y || 0) * 3,
        (n.z || 0) * 3
      )
    );
    const geo = new THREE.BufferGeometry()
      .setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({
      color: 0x112233,
    });
    const line = new THREE.Line(geo, mat);
    line.name = "micro_trail";
    scene.add(line);
  }
}
function updateStats(nodes) {
  document.getElementById("stat-nodes").textContent = nodes.length;
  document.getElementById("stat-reasoning").textContent =
    nodes.filter(n => n.node_type === "reasoning").length;
  document.getElementById("stat-tools").textContent =
    nodes.filter(n => n.node_type === "tool_call").length;
  document.getElementById("stat-errors").textContent =
    nodes.filter(n => n.status === "error").length;
  const maxStep = nodes.length > 0 ? Math.max(...nodes.map(n => n.step_number)) : "—";
  document.getElementById("stat-step").textContent = maxStep;
}

function renderNodesCombined(nodes) {
  clearScene();
  currentNodes = nodes;

  const sorted = [...nodes].sort(
    (a, b) => a.step_number - b.step_number
  );

  const microPoints = [];
  const parentPoints = [];

  sorted.forEach((node) => {
    const isParent = node.is_parent;
    const isMicro = node.node_type === "micro";
    const isHead = (
      node === sorted[sorted.length - 1]
    );

    // size based on node type
    const size = isParent ? 0.1 : 0.03;
    const color = isParent
      ? getNodeColor(node.node_type, node.status)
      : 0x334466;
    const emissiveIntensity = isParent ? 0.4 : 0.1;

    const geo = new THREE.SphereGeometry(size, 8, 8);
    const mat = new THREE.MeshPhongMaterial({
      color,
      emissive: color,
      emissiveIntensity,
      transparent: true,
      opacity: isParent ? 0.9 : 0.5,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      node.x * 3, node.y * 3, node.z * 3
    );
    mesh.userData = node;
    scene.add(mesh);
    nodeMeshes.push(mesh);

    if (isMicro) {
      microPoints.push(
        new THREE.Vector3(node.x * 3, node.y * 3, node.z * 3)
      );
    } else {
      parentPoints.push(
        new THREE.Vector3(node.x * 3, node.y * 3, node.z * 3)
      );
      trailPoints.push(
        new THREE.Vector3(node.x * 3, node.y * 3, node.z * 3)
      );
    }
  });

  // micro node trail — thin dim line
  if (microPoints.length > 1) {
    const geo = new THREE.BufferGeometry()
      .setFromPoints(microPoints);
    const mat = new THREE.LineBasicMaterial({
      color: 0x223344,
      linewidth: 1,
    });
    const line = new THREE.Line(geo, mat);
    scene.add(line);
  }

  // parent node trail — brighter line
  if (parentPoints.length > 1) {
    const geo = new THREE.BufferGeometry()
      .setFromPoints(parentPoints);
    const mat = new THREE.LineBasicMaterial({
      color: 0x334455,
      linewidth: 1,
    });
    trailLine = new THREE.Line(geo, mat);
    scene.add(trailLine);
  }

  // head on last node
  const head = sorted[sorted.length - 1];
  if (head) {
    const headGeo = new THREE.SphereGeometry(0.14, 24, 24);
    const headMat = new THREE.MeshPhongMaterial({
      color: 0xffffff,
      emissive: 0xffffff,
      emissiveIntensity: 0.9,
    });
    headMesh = new THREE.Mesh(headGeo, headMat);
    headMesh.position.set(
      head.x * 3, head.y * 3, head.z * 3
    );
    scene.add(headMesh);
  }

  updateStats(sorted.filter(n => n.is_parent));
}

// ─── HOVER TOOLTIP ─────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById("node-tooltip");

function checkHover(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeMeshes);
  if (hits.length > 0) {
    const node = hits[0].object.userData;
    tooltip.style.display = "block";
    tooltip.style.left = (e.clientX + 16) + "px";
    tooltip.style.top = (e.clientY - 10) + "px";
    tooltip.innerHTML = `
      <div class="tt-highlight">${node.node_type} — step ${node.step_number}</div>
      ${node.tool_name ? `<div class="tt-row">tool <span>${node.tool_name}</span></div>` : ""}
      ${node.status ? `<div class="tt-row">status <span>${node.status}</span></div>` : ""}
      ${node.latency_ms ? `<div class="tt-row">latency <span>${Math.round(node.latency_ms)}ms</span></div>` : ""}
      <div class="tt-row">id <span>${node.node_id ? node.node_id.slice(0, 8) : "—"}...</span></div>
    `;
  } else {
    tooltip.style.display = "none";
  }
}

// ─── API CALLS ─────────────────────────────────────────────
async function loadSession() {
  const id = document.getElementById("session-input").value.trim();
  if (!id) return;
  const res = await fetch(`/session/${id}`);
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  renderNodes(data.nodes);
}

async function loadLatestSession() {
  const res = await fetch("/sessions");
  const sessions = await res.json();
  if (!sessions.length) { alert("No sessions found"); return; }
  const latest = sessions[0];
  document.getElementById("session-input").value = latest.session_id;
  const res2 = await fetch(`/session/${latest.session_id}`);
  const data = await res2.json();
  if (data.error) { alert(data.error); return; }
  renderNodes(data.nodes);
}

async function loadMicroSession() {
  const id = document.getElementById("session-input").value.trim();
  if (!id) {
    await loadLatestSession();
    return;
  }
  const res = await fetch(`/session/${id}/combined`);
  const data = await res.json();
  if (data.error) {
    alert(data.error);
    return;
  }
  renderNodesCombined(data.nodes);
  document.getElementById("status").style.display = "none";
}

let ws = null;

function connectLive() {
  const id = document.getElementById("session-input").value.trim();
  if (!id) { alert("Enter a session ID first"); return; }

  if (ws) ws.close();

  const protocol = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${protocol}://${location.host}/ws/live/${id}`);

  document.getElementById("live-btn").classList.add("active");
  document.getElementById("live-btn").textContent = "Live — connected";

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.event === "update" && msg.nodes) {
      renderNodes(msg.nodes);
    }
  };

  ws.onclose = () => {
    document.getElementById("live-btn").classList.remove("active");
    document.getElementById("live-btn").textContent = "Connect live session";
  };
}

// ─── ANIMATION ─────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.01;

  // pulse head ring
  if (headMesh) {
    headMesh.material.opacity = 0.15 + Math.sin(t * 3) * 0.15;
    headMesh.lookAt(camera.position);
  }

  // gentle auto-rotate when not dragging
  if (!isDragging) {
    spherical.theta += 0.0001;
    updateCamera();
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
