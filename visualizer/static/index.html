<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentTrace HD</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0e0e0; font-family: monospace; overflow: hidden; }
#canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
#header { position: fixed; top: 20px; left: 20px; pointer-events: none; }
#header h1 { font-size: 13px; font-weight: normal; color: #7df9ff; letter-spacing: 0.15em; text-transform: uppercase; }
#header p { font-size: 10px; color: #444; margin-top: 3px; }
#conn-status { font-size: 10px; margin-top: 6px; }
#conn-status.connected { color: #98fb98; }
#conn-status.disconnected { color: #ff6b6b; }
#conn-status.reconnecting { color: #ffd700; }
#controls { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 6px; }
#session-input { background: #0d0d14; border: 0.5px solid #2a2a3a; color: #e0e0e0; padding: 6px 10px; font-family: monospace; font-size: 11px; width: 260px; outline: none; }
#session-input:focus { border-color: #7df9ff; }
.btn { background: transparent; border: 0.5px solid #2a2a3a; color: #666; padding: 5px 10px; font-family: monospace; font-size: 10px; cursor: pointer; text-align: left; transition: all 0.15s; }
.btn:hover { border-color: #7df9ff; color: #7df9ff; }
.btn.active { border-color: #98fb98; color: #98fb98; }
#stats { position: fixed; bottom: 20px; left: 20px; pointer-events: none; }
.stat-row { font-size: 10px; color: #444; margin-bottom: 3px; }
.stat-row span { color: #7df9ff; margin-left: 6px; }
#legend { position: fixed; bottom: 20px; right: 20px; pointer-events: none; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #555; margin-bottom: 5px; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
#status-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; color: #333; text-align: center; pointer-events: none; }
#tooltip { position: fixed; background: #0d0d14; border: 0.5px solid #2a2a3a; padding: 8px 12px; font-size: 10px; pointer-events: none; display: none; max-width: 220px; line-height: 1.7; z-index: 100; }
.tt-label { color: #7df9ff; margin-bottom: 4px; font-size: 11px; }
.tt-row { color: #444; }
.tt-row span { color: #ccc; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="header">
  <h1>AgentTrace HD</h1>
  <p>High-Dimensional Execution Space</p>
  <div id="conn-status" class="disconnected">● offline</div>
</div>

<div id="controls">
  <input id="session-input" type="text" placeholder="Session ID..." />
  <button class="btn" onclick="loadLatestSession()">Load latest session</button>
  <button class="btn" onclick="loadCombined()">Load micro trajectory</button>
  <button class="btn" id="live-btn" onclick="toggleLive()">Connect live</button>
  <button class="btn" onclick="clearScene()">Clear scene</button>
  <button class="btn" onclick="resetView()">Reset view</button>
</div>

<div id="stats">
  <div class="stat-row">nodes <span id="stat-nodes">0</span></div>
  <div class="stat-row">reasoning <span id="stat-reasoning">0</span></div>
  <div class="stat-row">tool calls <span id="stat-tools">0</span></div>
  <div class="stat-row">errors <span id="stat-errors">0</span></div>
  <div class="stat-row">step <span id="stat-step">—</span></div>
  <div class="stat-row">micro <span id="stat-micro">0</span></div>
</div>

<div id="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#7df9ff"></div>reasoning</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffd700"></div>tool call</div>
  <div class="legend-item"><div class="legend-dot" style="background:#98fb98"></div>tool response</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f11a1a"></div>error</div>
  <div class="legend-item"><div class="legend-dot" style="background:#fff"></div>head</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff93d6"></div>micro token</div>
</div>

<div id="status-msg">Load a session or connect live</div>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── RENDERER ──────────────────────────────────────────────
const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, alpha: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth / window.innerHeight, 0.01, 1000
);
camera.position.set(0, 2, 10);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0x7df9ff, 0.4);
dirLight.position.set(5, 5, 5);
scene.add(dirLight);

const grid = new THREE.GridHelper(20, 40, 0x111122, 0x111122);
scene.add(grid);

// ── CAMERA ORBIT ──────────────────────────────────────────
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0.3, phi: 1.1, r: 10 };

canvas.addEventListener("mousedown", e => {
  isDragging = true;
  prevMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener("mouseup", () => isDragging = false);
canvas.addEventListener("mousemove", e => {
  if (!isDragging) { checkHover(e); return; }
  spherical.theta -= (e.clientX - prevMouse.x) * 0.005;
  spherical.phi = Math.max(0.1, Math.min(
    Math.PI - 0.1,
    spherical.phi - (e.clientY - prevMouse.y) * 0.005
  ));
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});
canvas.addEventListener("wheel", e => {
  spherical.r = Math.max(2, Math.min(40, spherical.r + e.deltaY * 0.01));
  updateCamera();
}, { passive: true });

function updateCamera() {
  camera.position.set(
    spherical.r * Math.sin(spherical.phi) * Math.sin(spherical.theta),
    spherical.r * Math.cos(spherical.phi),
    spherical.r * Math.sin(spherical.phi) * Math.cos(spherical.theta)
  );
  camera.lookAt(0, 0, 0);
}
updateCamera();

function resetView() {
  spherical = { theta: 0.3, phi: 1.1, r: 10 };
  updateCamera();
}

// ── COLORS ────────────────────────────────────────────────
const COLORS = {
  reasoning:     0x7df9ff,
  tool_call:     0xffd700,
  tool_response: 0x98fb98,
  micro:         0xff93d6,
  error:         0xff6b6b,
  unknown:       0x666666,
};

function nodeColor(type, status) {
  if (status === "error") return COLORS.error;
  return COLORS[type] || COLORS.unknown;
}

// ── SCENE STATE ───────────────────────────────────────────
// Registry maps node_id → { mesh, data }
let registry = {};
let meshList = [];
let trailObjects = [];

// head state
let headMesh = null;
let headGlow = null;
let headCurrent = new THREE.Vector3();
let headTarget = new THREE.Vector3();
let headMoving = false;

function clearScene() {
  // remove all tracked objects
  meshList.forEach(m => scene.remove(m));
  trailObjects.forEach(o => scene.remove(o));
  if (headMesh) scene.remove(headMesh);
  if (headGlow) scene.remove(headGlow);

  meshList = [];
  trailObjects = [];
  registry = {};
  headMesh = null;
  headGlow = null;
  headMoving = false;

  updateStats([]);
  document.getElementById("status-msg").style.display = "block";
}

// ── NODE RENDERING ────────────────────────────────────────
function renderNodes(nodes) {
  if (!nodes || nodes.length === 0) return;
  document.getElementById("status-msg").style.display = "none";

  nodes.forEach(node => {
    const id = node.node_id;
    if (!id) return;

    const existing = registry[id];

    if (!existing) {
      // brand new node — add immediately
      const mesh = createNodeMesh(node);
      if (mesh) {
        scene.add(mesh);
        meshList.push(mesh);
        registry[id] = { mesh, data: node };
      }
    } else if (!existing.data.has_embedding && node.has_embedding) {
      // position update — snap to real HD coords
      existing.mesh.position.set(
        (node.x || 0) * 3,
        (node.y || 0) * 3,
        (node.z || 0) * 3
      );
      existing.data = node;
      // brighten micro on position arrival
      if (node.node_type === "micro") {
        existing.mesh.material.opacity = 0.80;
        existing.mesh.material.emissiveIntensity = 0.02;
      }
    } else if (existing.data.status !== node.status) {
      // status update — recolor
      const color = nodeColor(node.node_type, node.status);
      existing.mesh.material.color.setHex(color);
      existing.mesh.material.emissive.setHex(color);
      existing.data = node;
    }
  });

  rebuildTrails();
  updateHeadPosition(nodes);
  updateStats(nodes);
}

function createNodeMesh(node) {
  const isMicro = node.node_type === "micro";
  const isParent = node.is_parent;
  const size = isParent ? 0.08 : 0.022;
  const color = isParent
    ? nodeColor(node.node_type, node.status)
    : COLORS.micro;

  const geo = new THREE.SphereGeometry(size, isParent ? 12 : 6, isParent ? 12 : 6);
  const mat = new THREE.MeshPhongMaterial({
    color,
    emissive: color,
    emissiveIntensity: isParent ? 0.25 : 0.14,
    transparent: true,
    opacity: isParent ? 0.9 : 0.35,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(
    (node.x || 0) * 3,
    (node.y || 0) * 3,
    (node.z || 0) * 3
  );
  mesh.userData = node;
  mesh.name = node.node_id;
  return mesh;
}

// ── TRAILS ────────────────────────────────────────────────
function rebuildTrails() {
  // remove old trails
  trailObjects.forEach(o => scene.remove(o));
  trailObjects = [];

  const allData = Object.values(registry).map(r => r.data);

  // parent trail
  const parents = allData
    .filter(n => n.is_parent && n.has_embedding)
    .sort((a, b) => (a.step_number || 0) - (b.step_number || 0));

  if (parents.length > 1) {
    const pts = parents.map(n => new THREE.Vector3(
      (n.x || 0) * 3, (n.y || 0) * 3, (n.z || 0) * 3
    ));
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0x334466 })
    );
    scene.add(line);
    trailObjects.push(line);
  }

  // micro trail
  const micros = allData
    .filter(n => n.node_type === "micro" && n.has_embedding)
    .sort((a, b) => (a.step_number || 0) - (b.step_number || 0));

  if (micros.length > 1) {
    const pts = micros.map(n => new THREE.Vector3(
      (n.x || 0) * 3, (n.y || 0) * 3, (n.z || 0) * 3
    ));
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0x112233 })
    );
    scene.add(line);
    trailObjects.push(line);
  }
}

// ── HEAD ──────────────────────────────────────────────────
function updateHeadPosition(nodes) {
  const parents = nodes
    .filter(n => n.is_parent && n.has_embedding)
    .sort((a, b) => (a.step_number || 0) - (b.step_number || 0));

  if (parents.length === 0) return;

  const last = parents[parents.length - 1];
  headTarget.set(
    (last.x || 0) * 3,
    (last.y || 0) * 3,
    (last.z || 0) * 3
  );

  if (!headMesh) {
    headCurrent.copy(headTarget);
    buildHead();
  } else {
    headMoving = true;
  }
}

function buildHead() {
  if (headMesh) scene.remove(headMesh);
  if (headGlow) scene.remove(headGlow);

  const geo = new THREE.SphereGeometry(0.12, 20, 20);
  const mat = new THREE.MeshPhongMaterial({
    color: 0xffffff,
    emissive: 0xffffff,
    emissiveIntensity: 1.0,
  });
  headMesh = new THREE.Mesh(geo, mat);
  headMesh.position.copy(headCurrent);
  scene.add(headMesh);

  const ringGeo = new THREE.RingGeometry(0.16, 0.22, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.2,
  });
  headGlow = new THREE.Mesh(ringGeo, ringMat);
  headGlow.position.copy(headCurrent);
  scene.add(headGlow);
}

// ── STATS ─────────────────────────────────────────────────
function updateStats(nodes) {
  const parents = nodes.filter(n => n.is_parent);
  const micros = nodes.filter(n => n.node_type === "micro");
  document.getElementById("stat-nodes").textContent = parents.length;
  document.getElementById("stat-reasoning").textContent =
    parents.filter(n => n.node_type === "reasoning").length;
  document.getElementById("stat-tools").textContent =
    parents.filter(n => n.node_type === "tool_call").length;
  document.getElementById("stat-errors").textContent =
    parents.filter(n => n.status === "error").length;
  document.getElementById("stat-micro").textContent = micros.length;
  const steps = parents.map(n => n.step_number || 0);
  document.getElementById("stat-step").textContent =
    steps.length > 0 ? Math.max(...steps) : "—";
}

// ── TOOLTIP ───────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById("tooltip");

function checkHover(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(meshList);
  if (hits.length > 0) {
    const d = hits[0].object.userData;
    tooltip.style.display = "block";
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY - 8) + "px";
    tooltip.innerHTML = `
      <div class="tt-label">${d.node_type} · step ${d.step_number ?? "?"}</div>
      ${d.tool_name ? `<div class="tt-row">tool <span>${d.tool_name}</span></div>` : ""}
      ${d.status ? `<div class="tt-row">status <span>${d.status}</span></div>` : ""}
      ${d.latency_ms ? `<div class="tt-row">latency <span>${Math.round(d.latency_ms)}ms</span></div>` : ""}
      ${d.content ? `<div class="tt-row">token <span>${d.content.slice(0,20)}</span></div>` : ""}
      <div class="tt-row">id <span>${(d.node_id||"").slice(0,8)}…</span></div>
      <div class="tt-row">embedded <span>${d.has_embedding ? "yes" : "no"}</span></div>
    `;
  } else {
    tooltip.style.display = "none";
  }
}

// ── DATA LOADING ──────────────────────────────────────────
async function loadLatestSession() {
  try {
    const res = await fetch("/sessions");
    const sessions = await res.json();
    if (!sessions.length) { alert("No sessions found"); return; }
    const latest = sessions[0];
    document.getElementById("session-input").value = latest.session_id;
    await loadCombined(latest.session_id);
  } catch (e) {
    console.error("Load latest failed:", e);
  }
}

async function loadCombined(id) {
  id = id || document.getElementById("session-input").value.trim();
  if (!id) { alert("Enter a session ID"); return; }

  try {
    const res = await fetch(`/session/${id}/combined`);
    const data = await res.json();
    if (data.error) { console.warn(data.error); return; }
    clearScene();
    renderNodes(data.nodes);
  } catch (e) {
    console.error("Load combined failed:", e);
  }
}

// ── SSE LIVE CONNECTION ───────────────────────────────────
let sse = null;
let sseSessionId = null;
let sseReconnectTimer = null;
let sseReconnectDelay = 1000;
const SSE_MAX_DELAY = 16000;

function setConnStatus(state) {
  const el = document.getElementById("conn-status");
  el.className = state;
  el.textContent = {
    connected: "● live",
    disconnected: "● offline",
    reconnecting: "● reconnecting...",
  }[state] || "● offline";

  const btn = document.getElementById("live-btn");
  btn.classList.toggle("active", state === "connected");
  btn.textContent = state === "connected"
    ? "Disconnect"
    : state === "reconnecting"
    ? "Reconnecting..."
    : "Connect live";
}

function toggleLive() {
  if (sse) {
    stopSSE();
  } else {
    const id = document.getElementById("session-input").value.trim();
    if (!id) { alert("Enter a session ID first"); return; }
    startSSE(id);
  }
}

function startSSE(id) {
  stopSSE();
  sseSessionId = id;
  sseReconnectDelay = 1000;
  connectSSE();
}

function connectSSE() {
  if (!sseSessionId) return;

  sse = new EventSource(`/stream/${sseSessionId}`);
  setConnStatus("reconnecting");

  sse.onopen = () => {
    setConnStatus("connected");
    sseReconnectDelay = 1000;
    console.log("SSE connected:", sseSessionId);
  };

  sse.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.event === "update" && msg.nodes) {
        renderNodes(msg.nodes);
      }
    } catch (err) {
      console.warn("SSE parse error:", err);
    }
  };

  sse.onerror = () => {
    sse.close();
    sse = null;
    setConnStatus("reconnecting");

    // exponential backoff reconnect
    sseReconnectTimer = setTimeout(() => {
      sseReconnectDelay = Math.min(
        sseReconnectDelay * 2, SSE_MAX_DELAY
      );
      connectSSE();
    }, sseReconnectDelay);
  };
}

function stopSSE() {
  if (sseReconnectTimer) {
    clearTimeout(sseReconnectTimer);
    sseReconnectTimer = null;
  }
  if (sse) {
    sse.close();
    sse = null;
  }
  sseSessionId = null;
  setConnStatus("disconnected");
}

// ── ANIMATION LOOP ────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.016;

  // smooth head movement
  if (headMesh && headMoving) {
    headCurrent.lerp(headTarget, 0.08);
    headMesh.position.copy(headCurrent);
    if (headGlow) {
      headGlow.position.copy(headCurrent);
      headGlow.lookAt(camera.position);
      headGlow.material.opacity = 0.12 + Math.sin(t * 3) * 0.08;
    }
    if (headCurrent.distanceTo(headTarget) < 0.003) {
      headCurrent.copy(headTarget);
      headMoving = false;
    }
  } else if (headGlow) {
    headGlow.lookAt(camera.position);
    headGlow.material.opacity = 0.12 + Math.sin(t * 3) * 0.08;
  }

  // very slow auto-rotate when idle
  if (!isDragging) {
    spherical.theta += 0.0000015;
    updateCamera();
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
